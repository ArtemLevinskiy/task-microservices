version: '3.8'

services:
  backend-api:
    build: ./backend
    container_name: tasks-backend
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend-ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/tasks
    container_name: tasks-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge